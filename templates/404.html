{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="max-w-md mx-auto py-5">
        <div class="text-accent mb-3">
            <i class="fa-solid fa-book-skull display-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-primary-dark mb-2">404 - Page Not Found</h1>
        <p class="text-muted mb-4">
            The page or book record you are searching for does not exist in our library repository.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-accent rounded-pill px-4">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
            <a href="{{ url_for('books') }}" class="btn btn-outline-primary rounded-pill px-4">
                <i class="fa-solid fa-book-open me-1"></i> View Catalog
            </a>
        </div>
    </div>
</div>
{% endblock %}
