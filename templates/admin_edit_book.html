{% extends "base.html" %}

{% block title %}Edit Book - Library Administrator{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                <div class="p-4 bg-library-dark text-white d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge bg-danger bg-opacity-75 px-3 py-1 rounded-pill mb-1">Catalog Update</span>
                        <h4 class="fw-bold mb-0">Edit Book: {{ book.title }}</h4>
                    </div>
                    <span class="font-monospace text-light text-opacity-75">ID #{{ book.id }}</span>
                </div>

                <div class="p-4 p-md-5">
                    <form action="{{ url_for('admin_edit_book', book_id=book.id) }}" method="POST">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold small">Book Title <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold small">Category <span class="text-danger">*</span></label>
                                <select name="category" class="form-select" required>
                                    {% for cat in interest_options %}
                                    <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Author(s) <span class="text-danger">*</span></label>
                                <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold small">Price (₹ INR) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted">₹</span>
                                    <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ book.price or 450.0 }}" required>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold small">Catalog Availability <span class="text-danger">*</span></label>
                                <select name="available" class="form-select">
                                    <option value="1" {% if book.available == 1 %}selected{% endif %}>Available (1 Copy)</option>
                                    <option value="0" {% if book.available == 0 %}selected{% endif %}>Not Available (Issued/Reserved)</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold small">Book Description <span class="text-danger">*</span></label>
                                <textarea name="description" rows="4" class="form-control" required>{{ book.description }}</textarea>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
